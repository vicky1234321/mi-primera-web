<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi página con la fuente Oswald</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <style>
        /* Aquí va el código CSS para aplicar la fuente */
        body {
            font-family: 'Oswald', sans-serif;
        }

        h1 {
            color: #4CAF50; /* Un color de ejemplo para el título */
        }
    </style>
</head>
<body>

    <h1>Título con la fuente Oswald</h1>
    <p>Este es un párrafo de texto para mostrar la fuente Oswald. Se ve muy bien en celulares y computadoras.</p>

</body>
</html>
